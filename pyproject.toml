[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wfirma-mcp"
version = "0.3.0"
description = "Local MCP server for documented wFirma browser accounting reads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5", "python-dotenv>=1.1,<2", "defusedxml>=0.7,<1", "keyring>=25.6,<26; sys_platform == 'darwin'"]

[project.scripts]
wfirma-mcp = "wfirma_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/wfirma_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "docs/", "README.md", "WFIRMA_API.md", "pyproject.toml", "uv.lock", ".env.example", ".gitignore"]
